services:
  api:
    image: loan-api:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/model.joblib
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: loans
      POSTGRES_DB: loans
      POSTGRES_PASSWORD: loans_dev_only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loans -d loans"]
      interval: 5s
      timeout: 3s
      retries: 10
  adminer:
    image: adminer:4.8.1
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
volumes:
  pgdata:
